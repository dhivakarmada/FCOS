services:
  postgres:
    image: postgres:15-alpine
    container_name: fcos-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fcos_user
      POSTGRES_PASSWORD: fcos_password
      POSTGRES_DB: fcos_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcos_user -d fcos_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fcos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fcos-backend
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://fcos_user:fcos_password@postgres:5432/fcos_db?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "development_access_secret_123"
      JWT_REFRESH_SECRET: "development_refresh_secret_456"
      PORT: 4000
      PRISMA_CLIENT_ENGINE_TYPE: "library"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fcos-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000"
    depends_on:
      - backend

volumes:
  redis_data:
